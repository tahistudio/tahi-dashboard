name: Dashboard cron triggers

# Manual-only now. The recurring schedule that used to live here as a
# `schedule:` block moved to workers/cron-trigger/wrangler.jsonc, deployed
# by .github/workflows/cron-trigger-deploy.yml, on 2026-09-22.
#
# Why: GitHub Actions scheduled workflows were measured dropping 2 to 5
# runs an hour against the 12+ schedules configured here. Several
# dashboard crons (pre-call digest, transcript sync, briefing regen) were
# going stale. Cloudflare Cron Triggers on a dedicated worker fire
# reliably, so the schedule lives there now. See
# workers/cron-trigger/README.md and workers/cron-trigger/src/schedule.ts
# for the current schedule -> target -> path mapping.
#
# This workflow keeps only its manual path, for ad hoc re-runs from the
# Actions UI.
#
# Required GitHub repo settings:
#   - Variable: TAHI_DASHBOARD_URL = https://portal.tahi.studio
#                                     (the app serves at the domain root; a
#                                      legacy /dashboard suffix is stripped)
#   - Secret:   TAHI_CRON_SECRET   = the same string set as TAHI_CRON_SECRET
#                                     env var on the Worker

on:
  # Manual trigger via the Actions UI, pick which cron to fire.
  workflow_dispatch:
    inputs:
      target:
        description: 'Cron to trigger'
        type: choice
        required: true
        default: pre-call-digest
        options:
          - pre-call-digest
          - auto-promote-calls
          - leads-ai
          - daily-summary
          - ai-briefing
          - overview-brief
          - affiliate-reactivation
          - sync-calendar
          - sync-drive-transcripts
          - suggest-from-transcripts
          - sync-airwallex
          - sync-xero
          - sync-stripe
          - snapshot-metrics
          - finance-anomaly-scan
          - content-auto-backfill
          - content-gap-hunt
          - schema-watchdog
          - indexing-reverser
          - publish-scheduled

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pick endpoint(s) based on schedule
        id: pick
        env:
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: |
          # Map the firing cron schedule (or manual selection) to the
          # endpoint paths that should run. Multiple endpoints may fire
          # on the same minute (e.g. midnight UTC); we run them all.
          targets=""
          if [ -n "$MANUAL_TARGET" ]; then
            targets="$MANUAL_TARGET"
          else
            schedule="${{ github.event.schedule }}"
            case "$schedule" in
              "*/10 * * * *")                    targets="pre-call-digest" ;;
              "5,20,35,50 * * * *")              targets="auto-promote-calls" ;;
              "0 17 * * *")                      targets="leads-ai" ;;
              "0 15 * * *")                      targets="sync-xero sync-stripe" ;;
              "2,17,32,47 * * * *")              targets="sync-calendar" ;;
              "7,37 * * * *")                    targets="sync-drive-transcripts" ;;
              "12,42 * * * *")                   targets="suggest-from-transcripts" ;;
              "0 19 * * *"|"0 20 * * *")         targets="daily-summary ai-briefing overview-brief" ;;
              "0 19 * * MON")                    targets="affiliate-reactivation" ;;
              "0 18 * * *")                      targets="sync-airwallex snapshot-metrics" ;;
              "0 21 * * MON"|"0 21 1 * *")       targets="finance-anomaly-scan" ;;
              "0 22 * * SUN")                    targets="content-auto-backfill" ;;
              "30 19 * * SUN")                   targets="content-gap-hunt" ;;
              "0 23 * * SUN")                    targets="schema-watchdog" ;;
              "0 20 * * SUN")                    targets="indexing-reverser" ;;
              "3,18,33,48 * * * *")              targets="publish-scheduled" ;;
              *)                                 echo "::warning::Unknown schedule '$schedule'" ;;
            esac
          fi
          echo "Firing targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Call the dashboard cron endpoint(s)
        env:
          DASHBOARD_URL: ${{ vars.TAHI_DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.TAHI_CRON_SECRET }}
          TARGETS: ${{ steps.pick.outputs.targets }}
        run: |
          # Intentionally NO `set -e` here. A single failing curl
          # (e.g. exit 56 when the Worker hits its CPU limit mid-
          # response) must not crash the whole workflow; every cron
          # is idempotent and the next tick recovers. We log each
          # failure as a ::warning:: and continue to the next target.
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing TAHI_DASHBOARD_URL or TAHI_CRON_SECRET"
            exit 1
          fi
          # The app serves at the domain ROOT (Cloudflare direct). The old
          # Webflow Cloud /dashboard basePath is gone, so never append it:
          # doing so 404s every cron. Strip a legacy suffix defensively so a
          # stale TAHI_DASHBOARD_URL still resolves.
          base="${DASHBOARD_URL%/}"
          base="${base%/dashboard}"
          root="$base/api/admin"
          overall_status=0
          for target in $TARGETS; do
            # Most targets live under /cron/, but sync-* lives under
            # /integrations/google/.
            case "$target" in
              sync-calendar|sync-drive-transcripts) url="$root/integrations/google/$target" ;;
              # The suggester sits under /crons/ (plural), not /cron/, per
              # the CN.1 build contract. Named explicitly so the default
              # branch below cannot quietly 404 it.
              suggest-from-transcripts)             url="$root/crons/$target" ;;
              sync-airwallex)                       url="$root/integrations/airwallex/sync" ;;
              ai-briefing)                          url="$root/ai/briefing/cron" ;;
              overview-brief)                       url="$root/overview/brief/refresh" ;;
              *)                                    url="$root/cron/$target" ;;
            esac
            echo "POST $url"
            # --max-time guards against Worker hangs; --retry on
            # transient connection drops (curl 52/56) but not on
            # actual HTTP errors (those are handled below).
            response=$(curl -sS -w "\n%{http_code}" -X POST \
              --max-time 60 \
              --retry 1 --retry-delay 2 --retry-connrefused \
              "$url" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" 2>&1) || curl_exit=$?
            curl_exit=${curl_exit:-0}
            if [ "$curl_exit" -ne 0 ]; then
              echo "::warning::$target curl failed (exit $curl_exit): $response"
              # Non-zero curl is logged + continues; next tick handles it.
              continue
            fi
            body=$(echo "$response" | sed '$d')
            code=$(echo "$response" | tail -n1)
            echo "  HTTP $code"
            echo "$body" | head -c 800
            echo ""
            if [ "$code" != "200" ]; then
              echo "::warning::$target returned $code (continuing)"
            fi
          done
          exit $overall_status
