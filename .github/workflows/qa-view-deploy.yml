name: QA view worker deploy

# Auto-deploys workers/qa-view to Cloudflare whenever its source changes.
# The qa-view worker serves client sites inside the Site QA sandbox on its own
# origin, so it needs its own deploy lifecycle, like the MCP worker.
#
# Required GitHub repo secrets:
#   - CLOUDFLARE_API_TOKEN: a token with Worker Scripts: Edit on the
#     same Cloudflare account that hosts the worker. Generate via
#     https://dash.cloudflare.com/profile/api-tokens (template: "Edit
#     Cloudflare Workers").
#   - CLOUDFLARE_ACCOUNT_ID: find at the bottom of any Cloudflare
#     dashboard page (the "Account ID" field).
#
# How to trigger manually:
#   Actions → "QA view worker deploy" → Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'workers/qa-view/**'
      - 'lib/qa/**'
      - '.github/workflows/qa-view-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/qa-view/package-lock.json

      - name: Install
        # The build command (build-scanner.mjs) needs esbuild and axe-core,
        # so the install must run before wrangler deploy.
        working-directory: workers/qa-view
        run: npm ci

      - name: Type check
        # The worker doesn't ship a dedicated type-check script; run tsc
        # directly so a broken type lands as a red CI build, not a broken
        # live deploy.
        working-directory: workers/qa-view
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        working-directory: workers/qa-view
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --config pins wrangler to the worker's own config, without
        # this, wrangler 4.x walked up to the repo root's wrangler.json
        # (the dashboard's OpenNext config) and tried to deploy that.
        run: npx wrangler deploy --config wrangler.jsonc
